name: Build tdl-vp9-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: true

      - name: Show Go version
        run: go version

      - name: Confirm VP9 patch
        run: |
          grep -nE 'Test patch|VP9|width/height|no video track' core/util/mediautil/mediautil.go

      - name: Build tdl-vp9-test
        run: |
          go build -trimpath -ldflags="-s -w" -o tdl-vp9-test .

      - name: Check binary
        run: |
          chmod +x tdl-vp9-test
          ./tdl-vp9-test version
          ls -lh tdl-vp9-test

      - name: Pack artifact
        run: |
          tar -czf tdl-vp9-test-linux-amd64.tar.gz tdl-vp9-test
          sha256sum tdl-vp9-test-linux-amd64.tar.gz > tdl-vp9-test-linux-amd64.tar.gz.sha256
          cat tdl-vp9-test-linux-amd64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdl-vp9-test-linux-amd64
          path: |
            tdl-vp9-test-linux-amd64.tar.gz
            tdl-vp9-test-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
